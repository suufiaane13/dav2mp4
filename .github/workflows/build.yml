name: Build DAV Converter

on:
  push:
    branches: [main]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Download ffmpeg
        run: |
          curl -L -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          7z x ffmpeg.zip -offmpeg_extract
          mkdir bin
          copy ffmpeg_extract\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe bin\
          copy ffmpeg_extract\ffmpeg-master-latest-win64-gpl\bin\ffprobe.exe bin\

      - name: Verify files
        run: |
          python -c "import PyInstaller; print('PyInstaller:', PyInstaller.__version__)"
          dir bin
          dir app_icon.ico

      - name: Build exe
        run: python -m PyInstaller --clean -y dav_converter.spec

      - name: Verify build
        run: |
          dir dist\DAV_Converter
          dir dist\DAV_Converter\_internal\bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DAV_Converter
          path: dist/DAV_Converter/

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DAV_Converter/DAV_Converter.exe
          make_latest: true
